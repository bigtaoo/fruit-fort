# Every push and pull request: types, the 500-line limit, tests with coverage floors, and the build.
# A push to main that passes then publishes the web build to Cloudflare at
# swarmorbit.gamestao.com (wrangler/web.jsonc), which is the URL gamestao.com links.
#
# The deploy needs, in Settings -> Secrets and variables -> Actions:
#   Secrets    CLOUDFLARE_API_TOKEN   gamestao.com account, at least Workers Scripts:Edit
#              CLOUDFLARE_ACCOUNT_ID
#   Variables  WEB_DEPLOY_ENABLED = true   (unset: the deploy is skipped, so CI stays green
#                                           before the secrets are in)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# a newer push cancels an older run, except on main, where a deploy may be halfway through
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lines
      - run: npm run coverage
      - run: npm run build
      - run: npm run size
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  deploy-web:
    needs: check
    runs-on: ubuntu-24.04
    if: ${{ vars.WEB_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: web-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # checked last thing before the deploy: main may move while this builds, and a run that
      # finishes after a newer push's must never put the older build back
      - name: still main's tip?
        id: tip
        run: |
          set -eu
          git fetch -q --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "main has moved on from $GITHUB_SHA; its own run deploys" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: deploy to Cloudflare
        if: steps.tip.outputs.go == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy -c wrangler/web.jsonc
      - name: verify from the outside
        if: steps.tip.outputs.go == '1'
        run: |
          set -eu
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 -o /dev/null https://swarmorbit.gamestao.com/; then exit 0; fi
            sleep 3
          done
          echo "swarmorbit.gamestao.com did not answer" >&2
          exit 1
